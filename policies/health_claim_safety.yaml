name: health_claim_safety
description: >
  Safety gate for AI-generated health/wellness copy. Blocks unsupported or
  dangerous claims (FTC 2022 Health Products Compliance Guidance — claims need
  competent and reliable scientific evidence), requires a disclaimer, and
  enforces plain language. Nothing ships that could mislead a patient.
theme: Build for Your World

brief: >
  Write a short, encouraging promo for a vitamin D3 supplement for the general
  public.
source_truth: |
  Product: Sunly Vitamin D3 supplement
  Authorised claim: vitamin D supports normal bone and muscle function
  Dose: 1000 IU per softgel
  Required context: not a substitute for a varied diet or medical advice
  Hard rule: it must NOT claim to treat, cure, or prevent any disease
produces: [copy]

checks:
  # Tier 1 — deterministic safety gates
  - name: banned_health_claims
    type: banned_terms
    tier: 1
    target: copy
    params:
      terms: [cure, cures, miracle, "clinically proven", guaranteed, detox,
              "prevents disease", "treats", "boosts immunity"]
  - name: disclaimer_present
    type: required_terms
    tier: 1
    target: copy
    params:
      any: ["consult", "not a substitute", "healthcare", "doctor"]
  - name: plain_language
    type: reading_level
    tier: 1
    target: copy
    params:
      min: 60
  # Tier 2 — every claim must be backed by the authorised facts
  - name: claim_support
    type: claim_support
    tier: 2
    target: copy

limits:
  max_iters: 6
  budget_usd: 5.0
